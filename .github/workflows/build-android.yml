name: Build KSK Law Office v1.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - version-1.1.1
    paths:
      - 'ksk_law_office_app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1.1.1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        working-directory: ./ksk_law_office_app
        run: flutter create --platforms=android --project-name=lawoffice110 --org=com.ksklaw .

      - name: Install dependencies
        working-directory: ./ksk_law_office_app
        run: flutter pub get

      - name: Check package and version
        working-directory: ./ksk_law_office_app
        run: |
          grep -q "version: 1.1.1+3" pubspec.yaml
          grep -q "applicationId \"com.ksklaw.lawoffice110\"" android/app/build.gradle || grep -q "applicationId = \"com.ksklaw.lawoffice110\"" android/app/build.gradle.kts
          grep -q "targetSdk" android/app/build.gradle || grep -q "targetSdk" android/app/build.gradle.kts

      - name: Analyze and build release APK
        working-directory: ./ksk_law_office_app
        run: |
          rm -rf test
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release

      - name: Verify APK package and signature
        working-directory: ./ksk_law_office_app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "package: name='com.ksklaw.lawoffice110'|versionCode='3'|versionName='1.1.1'"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: KSK-Law-Office-v1.1.1-APK
          path: ksk_law_office_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
