
name: Build KSK Law Office APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip -o ksk_law_office_app_prototype.zip -d .

      - name: Build APK
        working-directory: ./ksk_law_office_app
        run: |
          flutter create --platforms=android --project-name=ksk_law_office --org=com.ksklaw .
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: KSK-Law-Office-APK
          path: ksk_law_office_app/build/app/outputs/flutter-apk/app-release.apk
          
