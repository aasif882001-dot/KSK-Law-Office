name: Prepare Flutter source for v1.1.0

on:
  push:
    branches:
      - version-1.1.0
    paths:
      - .github/workflows/prepare-source.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-1.1.0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract starter project
        run: |
          unzip -o ksk_law_office_app_prototype.zip -d .
          test -f ksk_law_office_app/lib/main.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ksk_law_office_app
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Flutter source on v1.1.0 branch"
            git push origin HEAD:version-1.1.0
          fi
